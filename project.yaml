  ## # # # # # # # # # # # # # # # # # # # 
  ## Cohort: CV 
  ## # # # # # # # # # # # # # # # # # # # 

  select_cv:
    run: r:v3 analysis/2-select/select.R cv
    needs:
    - prepare
    outputs:
      highly_sensitive:
        arrow: output/2-select/cv/*.arrow
      moderately_sensitive:
        csv: output/2-select/cv/*.csv
        png: output/2-select/cv/*.png

  ## # # # # # # # # # # # # # # # # # # # 
  ## Matching 
  ## # # # # # # # # # # # # # # # # # # # 

  adjust_cv_match_A:
    run: r:v3 analysis/3-adjust/balance.R cv match A
    needs:
    - select_cv
    outputs:
      highly_sensitive:
        arrow: output/3-adjust/cv/match-A/*.arrow

  adjust_cv_match_A_report:
    run: r:v3 analysis/3-adjust/report.R cv match A
    needs:
    - select_cv
    - adjust_cv_match_A
    outputs:
      moderately_sensitive:
        csv: output/3-adjust/cv/match-A/report/*.csv
        png: output/3-adjust/cv/match-A/report/*.png

  adjust_cv_match_B:
    run: r:v3 analysis/3-adjust/balance.R cv match B
    needs:
    - select_cv
    outputs:
      highly_sensitive:
        arrow: output/3-adjust/cv/match-B/*.arrow

  adjust_cv_match_B_report:
    run: r:v3 analysis/3-adjust/report.R cv match B
    needs:
    - select_cv
    - adjust_cv_match_B
    outputs:
      moderately_sensitive:
        csv: output/3-adjust/cv/match-B/report/*.csv
        png: output/3-adjust/cv/match-B/report/*.png

  ## # # # # # # # # # # # # # # # # # # # 
  ## Weighting 
  ## # # # # # # # # # # # # # # # # # # # 

  adjust_cv_weight_A:
    run: r:v3 analysis/3-adjust/balance.R cv weight A
    needs:
    - select_cv
    outputs:
      highly_sensitive:
        arrow: output/3-adjust/cv/weight-A/*.arrow

  adjust_cv_weight_A_report:
    run: r:v3 analysis/3-adjust/report.R cv weight A
    needs:
    - select_cv
    - adjust_cv_weight_A
    outputs:
      moderately_sensitive:
        csv: output/3-adjust/cv/weight-A/report/*.csv
        png: output/3-adjust/cv/weight-A/report/*.png

  adjust_cv_weight_B:
    run: r:v3 analysis/3-adjust/balance.R cv weight B
    needs:
    - select_cv
    outputs:
      highly_sensitive:
        arrow: output/3-adjust/cv/weight-B/*.arrow

  adjust_cv_weight_B_report:
    run: r:v3 analysis/3-adjust/report.R cv weight B
    needs:
    - select_cv
    - adjust_cv_weight_B
    outputs:
      moderately_sensitive:
        csv: output/3-adjust/cv/weight-B/report/*.csv
        png: output/3-adjust/cv/weight-B/report/*.png

  ## # # # # # # # # # # # # # # # # # # # 
  ## combine weights from all adjustment strategies 
  ## # # # # # # # # # # # # # # # # # # # 

  adjust_combine_cv:
    run: r:v3 analysis/3-adjust/combine-weights.R cv
    needs:
    - select_cv
    - adjust_cv_match_A
    - adjust_cv_match_B
    - adjust_cv_weight_A
    - adjust_cv_weight_B
    outputs:
      highly_sensitive:
        arrow: output/3-adjust/cv/combine/*.arrow

  ## # # # # # # # # # # # # # # # # # # # 
  ## Estimate cumulative incidence curves 
  ## # # # # # # # # # # # # # # # # # # # 
  ## ### Aalen-Johansen estimates 

  aj_cv_match_A_all_emergency:
    run: r:v3 analysis/4-contrast/aj.R --df_input=output/3-adjust/cv/combine/data_weights.arrow
      --dir_output=output/4-contrast/cv/match-A/all/emergency/aj/ --exposure=treatment
      --subgroups=all --origin_date=treatment_date --event_date=emergency_date --censoring_date=censor_date
      --competing_date=death_date --weight=wt_cv_match_A --max_fup=168 --min_count=6
      --method=constant --contrast=TRUE --plot=TRUE
    needs:
    - adjust_combine_cv
    outputs:
      highly_sensitive:
        arrow: output/4-contrast/cv/match-A/all/emergency/aj/*.arrow
      moderately_sensitive:
        csv: output/4-contrast/cv/match-A/all/emergency/aj/*.csv
        png: output/4-contrast/cv/match-A/all/emergency/aj/*.png

